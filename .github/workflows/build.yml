
name: Build Penalty Shootout APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK in Buildozer directory
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"

          sdkmanager --sdk_root="$SDK" \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"

      - name: Verify Android Build Tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          ls -la "$SDK/build-tools/33.0.2"
          test -x "$SDK/build-tools/33.0.2/aidl"
          "$SDK/build-tools/33.0.2/aidl" --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec
          java -version
          buildozer --version

      - name: Build APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show error summary
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "========== BARIS ERROR =========="
          grep -niE -C 3 \
            'Traceback|Exception|Error:|ERROR:|FAILED|Aidl not found|No such file|command not found|exit code' \
            build.log | tail -n 100 || true
          echo "========== 60 BARIS TERAKHIR =========="
          tail -n 60 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Penalty-Shootout-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Stop if APK build failed
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "Pembuatan APK gagal. Periksa Show error summary."
          exit 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Penalty-Shootout-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
